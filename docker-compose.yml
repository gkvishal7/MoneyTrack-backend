version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moneytrack-postgres
    environment:
      POSTGRES_DB: moneytrack
      POSTGRES_USER: moneytrack_user
      POSTGRES_PASSWORD: moneytrack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytrack_user -d moneytrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

